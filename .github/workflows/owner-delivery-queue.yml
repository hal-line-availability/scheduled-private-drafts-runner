name: Process approved private owner previews
on:
  workflow_dispatch:
    inputs:
      slack_connection_test:
        description: Verify only the fixed Slack failure destination
        type: boolean
        default: false
  schedule:
    - cron: '*/5 * * * *'
permissions:
  contents: read
concurrency:
  group: private-owner-preview-queue
  cancel-in-progress: false
jobs:
  process:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: hal-line-availability/hal-line-drafts
          ssh-key: ${{ secrets.PRIVATE_DRAFTS_DEPLOY_KEY }}
          persist-credentials: false
          path: generator
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: pip install --disable-pip-version-check -r generator/requirements.txt
      - name: Verify fixed Slack failure destination
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.slack_connection_test == true }}
        env:
          SLACK_FAILURE_BOT_TOKEN: ${{ secrets.SLACK_FAILURE_BOT_TOKEN }}
        run: python generator/work/run_owner_delivery_queue.py --slack-test
      - name: Check only explicitly confirmed private owner jobs
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.slack_connection_test != true }}
        env:
          PRIVATE_DRAFTS_DEPLOY_KEY: ${{ secrets.PRIVATE_DRAFTS_DEPLOY_KEY }}
          SLACK_FAILURE_BOT_TOKEN: ${{ secrets.SLACK_FAILURE_BOT_TOKEN }}
          SOURCE_DATABASE_URL: ${{ secrets.SOURCE_DATABASE_URL }}
          OWNER_LINE_TOKEN: ${{ secrets.OWNER_LINE_TOKEN }}
          ANNOUNCEMENT_LINE_TOKEN: ${{ secrets.ANNOUNCEMENT_LINE_TOKEN }}
          INQUIRY_LINE_TOKEN: ${{ secrets.INQUIRY_LINE_TOKEN }}
          # Enable only after an explicit customer-delivery authorization.
          CUSTOMER_SEND_ENABLED: 'false'
        run: |
          if ! python generator/work/run_owner_delivery_queue.py > owner-queue.log 2>&1; then
            echo 'Private owner queue check failed. No customer broadcast is supported.'
            exit 1
          fi

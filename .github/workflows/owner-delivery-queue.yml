name: Process approved private owner previews
on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
permissions:
  contents: read
concurrency:
  group: private-owner-preview-queue
  cancel-in-progress: false
jobs:
  process:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: jimuin0/hal-line-drafts
          ssh-key: ${{ secrets.PRIVATE_DRAFTS_DEPLOY_KEY }}
          persist-credentials: false
          path: generator
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: pip install --disable-pip-version-check -r generator/requirements.txt
      - name: Check only explicitly confirmed private owner jobs
        env:
          PRIVATE_DRAFTS_DEPLOY_KEY: ${{ secrets.PRIVATE_DRAFTS_DEPLOY_KEY }}
          SOURCE_DATABASE_URL: ${{ secrets.SOURCE_DATABASE_URL }}
          OWNER_LINE_TOKEN: ${{ secrets.OWNER_LINE_TOKEN }}
        run: |
          if ! python generator/work/run_owner_delivery_queue.py > owner-queue.log 2>&1; then
            echo 'Private owner queue check failed. No customer broadcast is supported.'
            exit 1
          fi

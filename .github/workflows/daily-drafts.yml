name: Prepare private salon drafts
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        default: prepare
        options: [prepare, verify]
  schedule:
    - cron: '30 8 * * *'
permissions:
  contents: read
concurrency:
  group: private-drafts-daily
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Read private generator
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: jimuin0/hal-line-drafts
          ssh-key: ${{ secrets.PRIVATE_DRAFTS_DEPLOY_KEY }}
          persist-credentials: false
          path: generator
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: pip install --disable-pip-version-check -r generator/requirements.txt
      - name: Validate generator
        run: |
          if ! python -m unittest discover -s generator/work -p 'test_*.py' > validation.log 2>&1; then
            echo 'Generator validation failed. No source data was retrieved.'
            exit 1
          fi
      - name: Generate drafts without customer delivery
        id: generate
        continue-on-error: true
        env:
          SOURCE_DATABASE_URL: ${{ secrets.SOURCE_DATABASE_URL }}
          RUN_MODE: ${{ inputs.mode || 'prepare' }}
        run: python generator/work/github_daily_drafts.py --mode "$RUN_MODE"
      - name: Record private result
        env:
          GENERATION_OUTCOME: ${{ steps.generate.outcome }}
          RUN_MODE: ${{ inputs.mode || 'prepare' }}
        run: |
          python - <<'PYTHON'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          outcome = os.environ['GENERATION_OUTCOME']
          status = 'verified' if os.environ['RUN_MODE']=='verify' else 'draft_prepared'
          Path('generator/outputs').mkdir(exist_ok=True)
          if os.environ['RUN_MODE'] != 'verify':
              Path('generator/outputs/last-run.json').write_text(json.dumps({
                  'status': status if outcome=='success' else 'needs_attention',
                  'attempted_at': datetime.now(timezone.utc).isoformat(),
                  'customer_sent': False,
              }))
          PYTHON
      - name: Open private draft storage
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: jimuin0/hal-line-drafts
          ref: drafts
          path: private-draft-store
          ssh-key: ${{ secrets.PRIVATE_DRAFTS_DEPLOY_KEY }}
          persist-credentials: true
      - name: Keep drafts private
        run: |
          if [ -d generator/outputs/generated ]; then
            mkdir -p private-draft-store/current
            cp generator/outputs/generated/* private-draft-store/current/
          elif [ -f generator/outputs/verification.json ]; then
            mkdir -p private-draft-store/status
            cp generator/outputs/verification.json private-draft-store/status/source-connection.json
          fi
          mkdir -p private-draft-store/status
          if [ -f generator/outputs/last-run.json ]; then
            cp generator/outputs/last-run.json private-draft-store/status/last-run.json
          fi
          cd private-draft-store
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add --all
          if ! git diff --cached --quiet; then
            git commit -m 'Prepare daily private drafts; no customer delivery'
            git push origin HEAD:drafts
          fi
      - name: Report stopped generation
        if: steps.generate.outcome == 'failure'
        run: |
          echo 'Source verification failed. Previous private drafts were retained. No customer delivery.'
          exit 1

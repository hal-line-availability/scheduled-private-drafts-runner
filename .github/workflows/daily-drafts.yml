name: Prepare private salon drafts
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        default: prepare
        options: [prepare, verify]
      at_target:
        description: Wait for the configured preparation time
        type: boolean
        default: false
      not_before:
        description: Optional one-time target with timezone (manual prepare only)
        type: string
        default: ''
  schedule:
    # Start early for 17:30 JST and retry once later if GitHub delayed or lost the first event.
    - cron: '3 8 * * *'
    - cron: '43 8 * * *'
permissions:
  contents: read
concurrency:
  group: private-drafts-daily
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - name: Read private generator
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: hal-line-availability/hal-line-drafts
          ssh-key: ${{ secrets.PRIVATE_DRAFTS_DEPLOY_KEY }}
          persist-credentials: false
          path: generator
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: pip install --disable-pip-version-check -r generator/requirements.txt
      - name: Open private draft storage
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: hal-line-availability/hal-line-drafts
          ref: drafts
          path: private-draft-store
          ssh-key: ${{ secrets.PRIVATE_DRAFTS_DEPLOY_KEY }}
          persist-credentials: true
      - name: Validate generator
        run: |
          if ! python -m unittest discover -s generator/work -p 'test_*.py' > validation.log 2>&1; then
            echo 'Generator validation failed. No source data was retrieved.'
            exit 1
          fi
          if ! node generator/work/test_editor_ui.cjs >> validation.log 2>&1; then
            echo 'Editor validation failed. No source data was retrieved.'
            exit 1
          fi
      - name: Keep a successful 17:30 pair during the catch-up event
        id: catchup
        env:
          SCHEDULE_EXPRESSION: ${{ github.event.schedule || '' }}
        run: |
          skip=false
          if [ "$SCHEDULE_EXPRESSION" = '43 8 * * *' ] && python generator/work/github_daily_drafts.py --catchup-check private-draft-store; then
            skip=true
            echo 'The verified 17:30 pair already exists. Catch-up left it unchanged.'
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
      - name: Generate drafts without customer delivery
        id: generate
        if: steps.catchup.outputs.skip != 'true'
        continue-on-error: true
        env:
          SOURCE_DATABASE_URL: ${{ secrets.SOURCE_DATABASE_URL }}
          RUN_MODE: ${{ inputs.mode || 'prepare' }}
          DRAFT_RETRY_MINUTES: '20'
          DRAFT_SCHEDULED_RUN: ${{ (github.event_name == 'schedule' || inputs.at_target == true) && 'true' || 'false' }}
          DRAFT_MANUAL_NOT_BEFORE: ${{ github.event_name == 'workflow_dispatch' && inputs.not_before || '' }}
        run: python generator/work/github_daily_drafts.py --mode "$RUN_MODE"
      - name: Record private result
        if: steps.catchup.outputs.skip != 'true'
        env:
          GENERATION_OUTCOME: ${{ steps.generate.outcome }}
          RUN_MODE: ${{ inputs.mode || 'prepare' }}
        run: |
          python - <<'PYTHON'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          outcome = os.environ['GENERATION_OUTCOME']
          status = 'verified' if os.environ['RUN_MODE']=='verify' else 'draft_prepared'
          Path('generator/outputs').mkdir(exist_ok=True)
          if os.environ['RUN_MODE'] != 'verify':
              reason={}
              failure=Path('generator/outputs/source-not-ready.json')
              if outcome!='success' and failure.exists():
                  reason={'reason':json.loads(failure.read_text())['reason']}
              Path('generator/outputs/last-run.json').write_text(json.dumps({
                  'status': status if outcome=='success' else 'needs_attention',
                  'attempted_at': datetime.now(timezone.utc).isoformat(),
                  'customer_sent': False,
                  **reason,
              }))
          PYTHON
      - name: Keep drafts private
        if: steps.catchup.outputs.skip != 'true'
        run: |
          if [ -d generator/outputs/generated ]; then
            mkdir -p private-draft-store/current
            cp generator/outputs/generated/* private-draft-store/current/
          elif [ -f generator/outputs/verification.json ]; then
            mkdir -p private-draft-store/status
            cp generator/outputs/verification.json private-draft-store/status/source-connection.json
          fi
          mkdir -p private-draft-store/status
          if [ -f generator/outputs/last-run.json ]; then
            cp generator/outputs/last-run.json private-draft-store/status/last-run.json
          fi
          cd private-draft-store
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add --all
          if ! git diff --cached --quiet; then
            git commit -m 'Prepare daily private drafts; no customer delivery'
            git push origin HEAD:drafts
          fi
      - name: Notify fixed Slack channel about stopped generation
        if: steps.catchup.outputs.skip != 'true' && steps.generate.outcome == 'failure'
        env:
          PRIVATE_DRAFTS_DEPLOY_KEY: ${{ secrets.PRIVATE_DRAFTS_DEPLOY_KEY }}
          SLACK_FAILURE_BOT_TOKEN: ${{ secrets.SLACK_FAILURE_BOT_TOKEN }}
        run: |
          if ! python generator/work/run_owner_delivery_queue.py --notify-only > slack-notify.log 2>&1; then
            echo 'The immediate Slack failure notice could not be confirmed. The fallback worker remains enabled.'
          fi
      - name: Report stopped generation
        if: steps.catchup.outputs.skip != 'true' && steps.generate.outcome == 'failure'
        run: |
          echo 'Source verification failed. Previous private drafts were retained. No customer delivery.'
          exit 1
